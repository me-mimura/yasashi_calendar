<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A4印刷対応の、保育施設で利用しやすいふりがなつきカレンダーを無料で作成できるサイトです。">
    <meta property="og:title" content="やさしいカレンダー作成ツール">
    <meta property="og:description" content="A4印刷対応のやさしいカレンダーメーカー">
    <title>やさしいカレンダー</title>

    <!-- こども向けのかわいい丸ゴシック体フォント (Zen Maru Gothic)-->
    <link rel="preconnect" href="https://fonts.googleleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?
    family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 画像としてダウンロードするためのライブラリ(html2canvas) -->
     <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- スタイルシート -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==============================================
         1. 上部タイトル：ピンクのスケッチブック風ヘッダー
         ============================================== -->
    <header class="sketchbook-header no-print">
        <!-- スケッチブックの白リング -->
        <div class="ring-row" aria-hidden="true">
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
        </div>

        <!-- クレヨン風・茶色枠のタイトル -->
        <div class="sketchbook-body">
            <h1 class="crayon-title">やさしいカレンダー</h1>
            <p class="subtitle">おうちでつくれる こどもカレンダー</p>
        </div>
    </header>

    <!-- ==============================================
         2.設定パネル：うすい灰色の横線つきノート風
         ============================================== -->
    <section class="notenook-panel no-print">
        <div class="notebook-inner">
            <h2 class="notebook-heading">✏️ カレンダーのせってい</h2>

            <div class="settings-grid">
                <!-- 年月の選択 -->
                <div class="setting-item">
                    <label for="year-month">つくる年月：</label>
                    <input type="month" id="year-month">
                </div>

                <!-- 用紙サイズ（横向き） -->
                <div class="setting-item">
                    <label for="paper-size">かみの大きさ：</label>
                    <select id="paper-size">  #プルダウンメニュー作成
                        <option value="a4" selected>A4（よこ）</option>
                        <option calue="a5">A5（よこ）</option>
                        <option calue="b4">B4（よこ）</option>
                        <option calue="b5">B5（よこ）</option>
                    </select>
                </div>

                <!-- ふりがな・表示設定 -->
                 <div class="setting-item checkbox-item">
                    <span class="item-label">ふりがな：</span>
                    <div class="checkboxes">
                        <label>
                            <input type="checkbox" id="ruby-weekday" checked>
                            ようびのふりがな
                        </label>
                        <label>
                            <input type="checkbox" id="ruby-special-dates" checked>
                            とくべつな日の よみかた(ついたち、はつか など)
                        </label>
                    </div>
                </div>

                <!-- 祝日の表示設定 -->
                <div class="setting-item checkbox-item">
                    <span class="item-label">しゅくじつ：</span>
                    <div class="checkboxes">
                        <label>
                            <input type="checkbox" id="show-holidays" checked>
                            しゅくじつの 名前をかく
                        </label>
                    </div>
                </div>

                <!-- 下部の画像アップロード -->
                <div class="setting-item">
                    <label for="image-upload">追加する イラスト・写真：</label>
                    <input type="file" id="image-upload" accept="image/*">
                </div>
            </div>

            <!-- 操作ボタン（印刷 ＆ 画像保存） -->
            <div class="action-buttons">
                <button type="button" id="print-btn" class="btn btn-print">
                    🖨️ いんさつする
                </button>
                <button type="button" id="download-btn" class="btn-download">
                    💾 がぞうをほぞんする（PNG）
                </button>
            </div>
        </div>
    </section>

    <!-- ==============================================
         3.カレンダーシート（印刷＆画像保存の対象エリア）
         ============================================== -->

    <main class="sheet-viewport">
        <article id="calendar-sheet" class="calendar-cheet a4 landscape">
        
            <!-- 年月ヘッダー（例：2026ねん 5がつ） -->
            <header class="calendar-sheet-header">
                <h2 id="calendar-title" class="sheet-title">2026ねん 5がつ</h2>
            </header>

            <!-- カレンダーグリッド -->
            <div class="calendar-table-wrapper">
                <table class="calendar-table">
                    <thead>
                        <tr id="calendar-weekdays">
                            <!-- JSで曜日（日～土）とルビを出力。日=赤、土=青 -->
                        </tr>
                    </thead>
                    <tbody id="calendar-days">
                        <!-- JSで以下のようなセルを動的に作成します：
                            <td>
                                <div class="date-number">
                                    <ruby>1<rt>ついたち</rt></ruby>
                                </div>
                                <div class="holiday-name">こどもの日</div>
                                <div class="sticker-memo-space"></div>
                            </td>
                        -->
                    </tbody>
                </table>
            </div>

            <!-- 下部のイラスト・自由スペース -->
            <section class="bottom-space" id="bottom-space">
                <div class="image-preview-wrapper" id="image-preview-wrapper">
                    <p class="placeholder-text">（ここに選んだ画像が入ります）</p>
                    <img id="preview-image" src="" alt="カレンダーのイラスト" class="hidden">
                </div>
            </section>

        </article>
    </main>


    <!-- スクリプト -->
    <script src="script.js"></script>
</body>
</html>
